# 시크릿은 전부 환경변수로 주입 — 이 파일에는 실제 값을 넣지 않습니다.
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  jwt:
    secret: ${JWT_SECRET}
    access-token-expiration: ${JWT_ACCESS_EXPIRATION:30m}
    refresh-token-expiration: ${JWT_REFRESH_EXPIRATION:14d}