<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8"/>
    <title>네이버 로그인 처리 중…</title>
    <style>
        body { font-family: system-ui, sans-serif; background: #0f172a; color: #e2e8f0;
               display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
    </style>
</head>
<body>
<p id="msg">네이버 로그인 처리 중…</p>
<script>
    // state 검증(CSRF 방지) 후 인가코드를 백엔드에 전달 → JWT 수신 → 메인으로 이동
    (async () => {
        const params = new URLSearchParams(location.search);
        const code = params.get('code');
        const state = params.get('state');
        const msgEl = document.getElementById('msg');
        if (!code) {
            msgEl.textContent = '로그인 실패: ' + (params.get('error_description') || params.get('error') || '인가코드 없음');
            return;
        }
        if (state !== sessionStorage.getItem('naver_oauth_state')) {
            msgEl.textContent = '로그인 실패: state 값이 일치하지 않습니다. 다시 시도해주세요.';
            return;
        }
        try {
            const res = await fetch('/api/auth/login/naver', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    code,
                    state,
                    redirectUri: location.origin + '/oauth/naver/callback.html',
                }),
            });
            const body = await res.json();
            if (!res.ok || body.isSuccess === false) throw new Error(body.message || '네이버 로그인 실패');
            const r = body.result;
            localStorage.setItem('accessToken', r.accessToken);
            localStorage.setItem('refreshToken', r.refreshToken);
            localStorage.setItem('user', JSON.stringify(r.user));
            sessionStorage.removeItem('naver_oauth_state');
            location.replace('/');
        } catch (e) {
            msgEl.textContent = e.message;
        }
    })();
</script>
</body>
</html>
