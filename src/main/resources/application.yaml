spring:
  application:
    name: backend

  profiles:
    default: local

  data:
    redis:
      host: localhost      # prod에서는 환경변수/프로필로 override
      port: 6379
      timeout: 3s          # 명령 응답 대기 상한 — 기본값 60초는 Redis 다운 시 요청을 너무 오래 붙잡는다
      connect-timeout: 3s  # 최초 커넥션 수립 대기 상한

  jpa:
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  # 마이그레이션은 prod에서만 실행 (application-prod.yaml에서 켠다).
  # 로컬은 ddl-auto: update가 스키마를 관리하던 기존 흐름 유지 —
  # 엔티티 변경 시 prod용 V{n}__*.sql 추가를 잊으면 CI(prod 프로필 테스트)가 잡아준다.
  flyway:
    enabled: false

# 관리 엔드포인트는 health(로드밸런서·배포 헬스체크)와 prometheus(메트릭 수집)만 노출.
# 나머지(env, beans, heapdump …)는 내부 정보 유출 통로라 열지 않는다.
# 프로덕션에서는 Nginx가 /actuator/** 외부 접근을 다시 한 번 차단한다(이중 방어).
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  metrics:
    distribution:
      # HTTP 응답시간을 히스토그램 버킷(le)으로도 내보낸다 — Grafana의 p95는
      # histogram_quantile(0.95, rate(http_server_requests_seconds_bucket[...]))로만 계산할 수 있다.
      # 기본값(false)이면 count·sum·max만 나와서 '평균'과 '최대'만 보이고 p95는 못 그린다.
      # percentiles(0.95)를 앱이 직접 계산하게 하는 방법도 있지만, 인스턴스별로 계산된 백분위수는
      # 더할 수 없다(blue+green 합산 p95 불가). 버킷은 더할 수 있다.
      percentiles-histogram:
        http.server.requests: true
      # 버킷 범위를 좁혀 시계열 수를 줄인다(uri·method·status 조합마다 버킷 수만큼 늘어난다).
      # 5ms 미만과 10s 초과는 구분할 필요가 없다 — Step 15의 최악 p95가 11.7s(풀 50 실험)였다.
      minimum-expected-value:
        http.server.requests: 5ms
      maximum-expected-value:
        http.server.requests: 15s

# Step 15 — p6spy 쿼리 로깅. 한 줄에 [실행시간 ms] + 바인딩된 SQL.
# 기본은 켜짐(로컬/테스트), application-prod.yaml에서 decorator.datasource.enabled=false로 프록시 자체를 뺀다.
# Hibernate show-sql은 파라미터가 ?로 남고 시간이 없어서 부하 분석에는 쓸모가 없다 — local에서 show-sql 대신 이걸 쓴다.
decorator:
  datasource:
    p6spy:
      enable-logging: true
      multiline: false
      logging: slf4j
      log-format: "%(executionTime) ms | %(category) | %(sqlSingleLine)"

# 대전 사과 제거의 원자성 확보 전략 (Step 10). NO_LOCK | REDISSON_LOCK | LUA
# 세 구현을 모두 남겨두고 여기서 고른다 — 비교 실험은 docs/clear_concurrency.md 참고.
# NO_LOCK은 중복 득점 버그 재현용이므로 실제 플레이에서는 쓰지 않는다.
game:
  clear:
    strategy: LUA
