# 유일한 외부 진입점. Docker 내부 네트워크에만 존재하는 나머지 서비스로 프록시한다.
# Phase 2 — TLS 종료(termination)를 nginx가 담당한다: 브라우저↔nginx는 https,
# nginx↔app은 내부 http다. app은 TLS를 몰라도 되고(자바 코드 무변경), 원래 요청이
# https였다는 사실은 X-Forwarded-Proto로 전달된다(forward-headers-strategy: framework).

# 80 — ACME 챌린지만 평문으로 응답하고 나머지는 전부 https로 영구 리다이렉트한다.
server {
    listen 80;
    server_name _;

    # Let's Encrypt http-01 — 발급·갱신 시 CA가 이 경로로 찾아온다. 리다이렉트보다 먼저
    # 매칭되어야 하므로 아래 location / 보다 구체적인 이 prefix가 우선한다.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 그 외 전부 https로. $host가 아니라 정규 도메인으로 보내, 옛 IP(http://223.130.152.28)
    # 링크로 들어와도 인증서가 있는 도메인에 안착하게 한다(IP로 리다이렉트하면 cert 불일치).
    location / {
        return 301 https://myapplegame.duckdns.org$request_uri;
    }
}

# 443 — 실제 서비스. 기존 80 서버 블록의 프록시 설정을 그대로 옮겼다.
server {
    listen 443 ssl;
    http2 on;
    server_name myapplegame.duckdns.org;

    ssl_certificate     /etc/letsencrypt/live/myapplegame.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/myapplegame.duckdns.org/privkey.pem;

    # HSTS — 첫 방문 이후 브라우저가 이 도메인을 https로만 열게 각인해, 최초 평문 왕복에서의
    # SSL stripping을 막는다. 도메인·인증서가 안정된 뒤 max-age를 1년으로 늘린다.
    # 우선 30일로 시작(문제 시 롤백 여지). preload/includeSubDomains는 아직 붙이지 않는다.
    add_header Strict-Transport-Security "max-age=2592000" always;

    # Docker 내장 DNS. proxy_pass에 변수($active_app)를 쓰면 기동 시점이 아니라
    # 요청 시점에 이름을 풀기 때문에, 꺼져 있는 색(blue/green) 때문에
    # nginx가 기동/reload에 실패하는 문제가 없다. valid=5s로 재기동한 컨테이너의
    # 새 IP도 금방 따라간다.
    resolver 127.0.0.11 valid=5s;

    # 활성 색 정의 (set $active_app "app-blue";) — deploy.sh가 교체
    # nginx/ 디렉터리 전체를 /etc/nginx/conf.d 로 마운트한다.
    # 단일 파일 마운트를 피하는 이유: sed -i는 파일을 새로 만들어 교체(inode 변경)
    # 하는데, 단일 파일 bind mount는 옛 inode를 붙잡고 있어 변경이 컨테이너에 안 보인다.
    include /etc/nginx/conf.d/active_upstream.inc;

    # 공통 프록시 헤더 — 앱은 forward-headers-strategy: framework로 이 값을 신뢰한다.
    # 주의: proxy_set_header는 location에서 하나라도 정의하면 여기 것을 전부 상속하지
    # 않는다(전부 아니면 전무). Host가 빠지면 기본값 $proxy_host(app-blue:8080 등)가
    # 전달돼 SockJS의 same-origin 검사가 브라우저 Origin과 불일치로 403을 낸다.
    # → Upgrade 등을 정의하는 location은 아래 네 줄도 반드시 다시 선언할 것.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # 관리 엔드포인트는 외부 차단 — Prometheus는 내부망에서 앱 8080으로 직접 수집
    location /actuator/ {
        return 403;
    }

    # WebSocket(STOMP/SockJS): Upgrade 핸드셰이크 헤더 + 게임 세션이 오래 유지되도록 긴 timeout.
    # https 위에서는 브라우저가 자동으로 wss로 붙는다(SockJS가 상대경로라 페이지 스킴 상속).
    location /ws {
        proxy_pass http://$active_app:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        # 위에서 proxy_set_header를 정의했으므로 server 블록의 공통 헤더가 상속되지
        # 않는다 — 재선언. Host가 없으면 SockJS same-origin 검사 403 (서버 블록 주석 참고)
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Grafana는 3000 포트를 열지 않고 경로로만 접근 (GF_SERVER_SERVE_FROM_SUB_PATH=true와 짝)
    location /grafana/ {
        proxy_pass http://grafana:3000;
        # Grafana Live(대시보드 실시간 갱신)가 WebSocket을 쓴다
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        # /ws와 같은 이유로 재선언 — Host가 없으면 GF_SERVER_ROOT_URL의 %(domain)s가
        # grafana(컨테이너명)로 잡혀 로그인 리다이렉트가 깨질 수 있다
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 정적 파일 + REST API — Phase 1에서는 앱(Spring)이 정적 파일도 서빙한다
    location / {
        proxy_pass http://$active_app:8080;
    }
}
