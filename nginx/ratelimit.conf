# 요청 빈도 제한 — zone 정의 (#58)
#
# conf.d/*.conf 는 nginx.conf 가 http 컨텍스트에 자동 include 한다. limit_req_zone 은 http 레벨
# 지시어라 server 블록 안(default.conf)에는 둘 수 없어 파일을 나눴다. 적용(limit_req)은
# default.conf 의 location 에 있다 — "어디서 세는가"와 "어디에 거는가"를 분리한 것.
#
# 키 = $binary_remote_addr (클라이언트 IP). Cloudflare 는 DNS only(프록시 아님)라 remote_addr 이
# 실제 클라이언트 IP다. zone 10m ≈ IP 16만 개 상태. 가득 차면 가장 오래된 항목을 재사용한다.
#
# 동작 모델(leaky bucket): rate 는 평균 허용 속도, burst 는 순간 허용량. nodelay 가 있으면
# burst 까지는 즉시 통과시키고 넘치는 요청을 거절한다(없으면 큐에 넣어 지연시킨다).
# 로그인은 사람이 연타해도 10회를 넘기기 어렵고, 대입 공격은 IP당 분당 10회로는 의미가 없다.

# auth — 로그인·가입·재발급. BCrypt(요청당 CPU 60~100ms)가 도는 엔드포인트라 앱에 닿기 전에 막는다.
#        2 vCPU 에서 BCrypt 상한은 약 50 req/s(load_test.md S3) — IP 하나가 분당 10회면 CPU 의 0.3% 다.
limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;

# api — 나머지 REST + 정적 파일. 정상 플레이는 초당 몇 건(방 생성·입장·기록 제출·랭킹)이고
#       사과 제거는 WebSocket(/ws, 제한 없음)이라 여기 안 걸린다. 페이지 첫 로드의 정적 파일
#       묶음(html·css·js·svg 10개 안팎)은 burst 로 흡수한다.
limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;

# 거절은 기본 503 대신 429(Too Many Requests) — 프론트 api.js 가 "잠시 후 다시 시도"로 구분한다.
# 503 은 배포 전환 중의 일시 장애와 구분되지 않는다.
limit_req_status 429;

# 거절된 요청은 error.log 에 warn 으로 남는다 — 앱에 도달하지 않으므로 앱 지표(Prometheus)에는 안 잡힌다.
# 429 가 얼마나 나가는지는 access.log 의 상태코드로 센다.
limit_req_log_level warn;
