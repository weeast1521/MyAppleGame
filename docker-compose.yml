# 로컬 개발용 인프라 (MySQL + Redis)
# 접속 정보는 src/main/resources/application-local.yaml 과 일치해야 한다.
services:
  mysql:
    image: mysql:8
    container_name: apple-mysql
    environment:
      MYSQL_ROOT_PASSWORD: applegame
      MYSQL_DATABASE: applegame
    ports:
      # 로컬 Windows에 MySQL80 서비스가 3306을 점유 중이라 호스트 쪽은 3307 사용
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-papplegame"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    container_name: apple-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

volumes:
  mysql-data:
  redis-data:
