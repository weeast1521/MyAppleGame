# 로컬 개발용 인프라 (MySQL + Redis)
# 접속 정보는 src/main/resources/application-local.yaml 과 일치해야 한다.
# 비밀번호는 .env 로 분리 (.env.example 참고) — 없으면 기본값 applegame 사용.
services:
  mysql:
    # 프로덕션(docker-compose.prod.yml)과 동일한 8.4 LTS로 고정.
    # latest(:8)를 따라가면 로컬-프로드 버전이 어긋나거나 자동 메이저 업그레이드로 볼륨이 깨질 수 있다.
    image: mysql:8.4
    container_name: apple-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-applegame}
      MYSQL_DATABASE: applegame
    ports:
      # 로컬 Windows에 MySQL80 서비스가 3306을 점유 중이라 호스트 쪽은 3307 사용
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-applegame}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    container_name: apple-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  # ── 모니터링 (선택) ──────────────────────────────────────────
  # 기본 `docker compose up -d`에는 뜨지 않는다. 부하 실습 때만:
  #   docker compose --profile monitoring up -d
  #   Grafana http://localhost:3000 (로그인 없음) → AppleGame 폴더 → 부하 실습 대시보드
  # 데이터소스·대시보드는 prod와 같은 provisioning 파일을 읽는다 — 로컬에서 만든 패널이 그대로 VM에 올라간다.
  prometheus:
    image: prom/prometheus:v2.53.4
    container_name: apple-prometheus
    profiles: [monitoring]
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.local.yml:/etc/prometheus/prometheus.yml:ro
    # Linux 도커 엔진에는 host.docker.internal이 기본으로 없다(Docker Desktop만 제공) — 명시해 두면 양쪽에서 동작
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:11.6.0
    container_name: apple-grafana
    profiles: [monitoring]
    ports:
      - "3000:3000"
    environment:
      PROMETHEUS_SCRAPE_INTERVAL: 5s
      # 로컬 전용 — 로그인 없이 Admin으로 들어간다. prod는 GF_SECURITY_ADMIN_PASSWORD로 로그인.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
    depends_on:
      - prometheus

volumes:
  mysql-data:
  redis-data:
