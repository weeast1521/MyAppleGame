# 프로덕션 (VM: /opt/applegame)
#   최초 기동:  docker compose -f docker-compose.prod.yml --profile blue up -d
#   배포:       scripts/deploy.sh <이미지태그>   (blue-green 무중단 전환)
# 시크릿은 같은 디렉터리의 .env 에서 읽는다 (.env.example 참고).
# 외부에 여는 포트는 nginx의 80 하나뿐 — 나머지는 Docker 내부 네트워크 전용.

# blue/green이 공유하는 앱 설정. YAML 앵커로 중복 제거.
x-app: &app
  image: ghcr.io/weeast1521/myapplegame:${APP_TAG:-latest}
  environment:
    # 호스트(VM)는 KST로 맞췄지만 컨테이너는 각자 UTC가 기본 — 로그·랭킹 시각이
    # 9시간 어긋나지 않게 시각을 다루는 컨테이너마다 TZ를 넣는다(§2).
    # prometheus·node-exporter는 제외: 설계상 항상 UTC로 동작하고 이미지에 tzdata도 없다.
    TZ: Asia/Seoul
    SPRING_PROFILES_ACTIVE: prod
    DB_URL: ${DB_URL}
    DB_USERNAME: ${DB_USERNAME}
    DB_PASSWORD: ${DB_PASSWORD}
    JWT_SECRET: ${JWT_SECRET}
    # 15GB 중 앱 힙 2GB — 설계서 §3 메모리 예산
    JAVA_TOOL_OPTIONS: "-Xmx2g"
  # 컨테이너 메모리 상한 3g = 힙 2g + 힙 밖 1g (§3).
  # -Xmx2g가 제한하는 것은 힙뿐이고 메타스페이스·스레드 스택·다이렉트 버퍼·JIT 코드 캐시는
  # 힙 밖이라 JVM 옵션으로 막히지 않는다. 상한을 힙과 같은 2g로 잡으면 힙이 차기도 전에
  # 컨테이너가 OOM kill 당한다. 200 VU 부하에서는 톰캣 스레드 스택과 WebSocket 버퍼가 늘어
  # 힙 밖이 실제로 커지는 쪽이다(부하 테스트 S1/S4 참고).
  # swarm 전용인 deploy.resources.limits는 일반 compose에서 조용히 무시되므로 mem_limit을 쓴다.
  mem_limit: 3g
  depends_on:
    mysql:
      condition: service_healthy
    redis:
      condition: service_started
  restart: unless-stopped

services:
  nginx:
    image: nginx:1.27-alpine
    container_name: apple-nginx
    environment:
      TZ: Asia/Seoul
    ports:
      - "80:80"
      # Phase 2 — HTTPS. ACG는 443이 이미 열려 있고(§7), VM firewalld에 https 추가가 필요하다.
      - "443:443"
    volumes:
      # 디렉터리째 마운트 — deploy.sh의 sed -i(active_upstream.inc 교체)가 반영되게.
      # active_upstream.inc는 git이 추적하지 않는 VM 로컬 상태 파일 — 없으면 .example에서 복사(deploy.sh가 처리)
      - ./nginx:/etc/nginx/conf.d:ro
      # TLS 인증서(certbot이 씀·nginx가 읽음)와 ACME 챌린지 webroot. named volume이라
      # nginx 재생성·app 배포와 무관하게 살아남는다. nginx는 읽기만 하므로 :ro.
      - letsencrypt:/etc/letsencrypt:ro
      - certbot-webroot:/var/www/certbot:ro
    depends_on:
      - grafana
    # 128m — nginx는 요청을 흘려보내기만 하고 상태를 들지 않는다. 워커 프로세스 + 연결 버퍼 몫.
    mem_limit: 128m
    restart: unless-stopped

  # Let's Encrypt 인증서 발급·갱신 (Phase 2). 상주 서비스가 아니라 필요할 때만 실행한다:
  #   발급:  docker compose -f docker-compose.prod.yml run --rm certbot \
  #            certonly --webroot -w /var/www/certbot -d myapplegame.duckdns.org \
  #            --email <메일> --agree-tos --no-eff-email
  #   갱신:  docker compose -f docker-compose.prod.yml run --rm certbot renew --quiet
  #          → 이후 nginx -s reload (cron으로 하루 2회, INFRA.md §Phase 2 참고)
  # profiles로 묶어 평소 `up -d`에는 뜨지 않는다. nginx와 같은 named volume을 공유하며,
  # certbot은 인증서·webroot에 써야 하므로 nginx와 달리 :ro 없이 마운트한다.
  certbot:
    image: certbot/certbot:latest
    container_name: apple-certbot
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot-webroot:/var/www/certbot
    profiles: ["certbot"]
    restart: "no"

  # blue/green 두 색 중 한쪽만 기동한다 (--profile blue|green).
  # 프로필이 없으면 `up -d` 한 번에 둘 다 떠서 메모리를 2배로 먹는다.
  # 서비스 이름에 밑줄(_)을 쓰면 안 된다 — Docker DNS 호스트명이 되는데 호스트명 규칙(RFC 1123)상
  # 밑줄은 불가라 Tomcat이 `Host: app_blue:8080`을 400으로 거절한다(헬스체크·Prometheus 수집 실패).
  app-blue:
    <<: *app
    container_name: apple-app-blue
    profiles: ["blue"]

  app-green:
    <<: *app
    container_name: apple-app-green
    profiles: ["green"]

  mysql:
    image: mysql:8.4
    container_name: apple-mysql
    environment:
      # JDBC URL의 serverTimezone=Asia/Seoul과 짝 — DB의 NOW()·로그도 KST로
      TZ: Asia/Seoul
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: applegame
    # skip-log-bin: binlog는 복제용인데 VM 1대라 복제가 없다 — 디스크만 먹는다 (§3-1)
    # buffer pool 2G: §3 메모리 예산. 기본 128M이면 데이터가 조금만 커져도 디스크를 두드린다
    command:
      - --skip-log-bin
      - --innodb-buffer-pool-size=2G
    # 상한 3g = buffer pool 2G + 그 밖(커넥션별 정렬·조인 버퍼, 임시 테이블, 스레드) 1g.
    # buffer pool만 계산하면 부하 시 커넥션이 늘 때 상한을 넘는다 — 앱의 힙/힙 밖 관계와 같은 구조다.
    mem_limit: 3g
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${DB_PASSWORD}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7
    container_name: apple-redis
    environment:
      TZ: Asia/Seoul
    # 이 Redis는 캐시가 아니라 랭킹(ZSET)·방 상태의 원본 저장소다 — 설계서 §2 "데이터".
    #   appendonly yes: 모든 쓰기를 AOF 로그로 남겨 재시작해도 유실 없게
    #                   (기본값은 RDB 스냅샷만이라 마지막 스냅샷 이후 쓰기가 날아간다)
    #   maxmemory 1gb + noeviction: 상한 도달 시 데이터를 몰래 지우는(eviction) 대신
    #                   쓰기를 에러로 거부 — 랭킹이 조용히 사라지는 것보다 낫다 (§3 메모리 예산)
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - 1gb
      - --maxmemory-policy
      - noeviction
    # 상한 1.5g = maxmemory 1gb + 오버헤드 0.5g.
    # 오버헤드는 AOF 재작성(fork 시 COW로 일시적으로 메모리가 늘어난다)과 클라이언트 버퍼 몫이다.
    # maxmemory와 같은 1g로 잡으면 AOF rewrite 중에 컨테이너가 죽는다 —
    # noeviction이라 데이터를 지우지 않고 버티는 설계와 짝이 되는 여유분.
    mem_limit: 1.5g
    volumes:
      - redis-data:/data
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.53.4
    container_name: apple-prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    # 1g — 최근 2시간치 시계열을 메모리(head block)에 들고 있다가 디스크로 내린다.
    # retention 15d라 대부분은 디스크(prometheus-data)에 있고 메모리는 head block + 쿼리 작업공간 몫.
    mem_limit: 1g
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.6.0
    container_name: apple-grafana
    environment:
      TZ: Asia/Seoul
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      # 3000 포트를 열지 않고 nginx의 /grafana/ 경로로만 접근하기 위한 설정 짝
      GF_SERVER_ROOT_URL: "%(protocol)s://%(domain)s/grafana/"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      # provisioning 데이터소스의 timeInterval — monitoring/prometheus.yml의 scrape_interval과 짝
      PROMETHEUS_SCRAPE_INTERVAL: 15s
    volumes:
      - grafana-data:/var/lib/grafana
      # 데이터소스·대시보드 선언(#32). 클릭 설정은 grafana-data 볼륨에만 사는 '상태'라 재현이 안 된다.
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
    # 512m — 대시보드 렌더링은 브라우저가 하고 Grafana는 쿼리를 중계한다(access: proxy).
    # Phase 3에서 대시보드가 늘어도 메모리는 크게 안 변하는 쪽.
    mem_limit: 512m
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:v1.9.1
    container_name: apple-node-exporter
    # 컨테이너가 아니라 호스트(VM)의 지표를 읽도록 호스트 FS를 읽기 전용 마운트
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs
    # 64m — 스크랩 요청마다 /proc·/sys를 읽어 즉석에서 응답한다. 상태를 저장하지 않는다.
    mem_limit: 64m
    restart: unless-stopped

volumes:
  mysql-data:
  redis-data:
  prometheus-data:
  grafana-data:
  # TLS 인증서(/etc/letsencrypt)와 ACME 챌린지 파일(/var/www/certbot). Phase 2.
  letsencrypt:
  certbot-webroot:
