# main 푸시 → 테스트 → GHCR 이미지 push → VM ssh 접속 → blue-green 전환
# 필요한 리포 시크릿: SSH_HOST(서버 IP), SSH_USER(deploy), SSH_KEY(개인키)
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: # 수동 재배포용

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/myapplegame

jobs:
  test:
    runs-on: ubuntu-latest
    # 통합 테스트가 실제 MySQL/Redis를 요구하므로 서비스 컨테이너로 띄운다
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: test
          MYSQL_DATABASE: applegame
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost -uroot -ptest"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      # prod 프로필로 돌리는 이유:
      #  1) gitignore된 application-local.yaml 없이도 환경변수만으로 설정이 완성된다
      #  2) 매 CI마다 빈 DB에 Flyway V1~이 적용되고 Hibernate validate가 검증한다
      #     → 엔티티만 바꾸고 마이그레이션 추가를 잊으면 여기서 실패한다
      - name: Build & Test (prod profile + Flyway validate)
        env:
          SPRING_PROFILES_ACTIVE: prod
          DB_URL: jdbc:mysql://127.0.0.1:3306/applegame?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
          DB_USERNAME: root
          DB_PASSWORD: test
          REDIS_HOST: 127.0.0.1
          # CI 전용 더미 (base64, 256비트 이상) — 실제 서비스 값과 무관
          JWT_SECRET: Y2ktb25seS1kdW1teS1qd3Qtc2VjcmV0LW5vdC11c2VkLWFueXdoZXJlLW91dHNpZGUtZ2l0aHViLWFjdGlvbnMtMDAwMQ==
        run: ./gradlew build

  build-and-push:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # GITHUB_TOKEN으로 GHCR push 허용

    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # sha 태그로 배포(재현 가능), latest는 편의용 별칭
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          # gradle 의존성 레이어를 GitHub Actions 캐시에 보존 — 코드만 바뀐
          # 빌드가 수 분 → 수십 초로 줄어든다
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: SSH & blue-green switch
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          # 헬스 대기까지 스크립트가 하므로 여유 있게
          command_timeout: 10m
          # 배포 설정(compose·nginx·scripts)은 리포가 원본이므로 VM 사본을 먼저 맞춘다.
          # --ff-only: VM에서 손으로 고친 커밋이 있으면 병합하지 않고 실패시켜 드러낸다.
          # .env·active_upstream.inc는 git이 추적하지 않아 pull에 영향받지 않는다.
          script: |
            set -e
            cd /opt/applegame
            git pull --ff-only origin main
            scripts/deploy.sh ${{ github.sha }}
